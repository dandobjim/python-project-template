name: Template CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-and-test:
    name: Render & test (Python ${{ matrix.python_version }}, ${{ matrix.type_checker }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        type_checker: [mypy, pyrefly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Copier reads git tags

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: copier.yml

      - name: Render template
        # --vcs-ref HEAD renders the commit under test instead of the latest tag
        run: >-
          uvx copier copy --defaults --vcs-ref HEAD
          --data project_name=demo-app
          --data author_name=CI
          --data author_email=ci@example.com
          --data github_username=ci
          --data python_version=${{ matrix.python_version }}
          --data type_checker=${{ matrix.type_checker }}
          . "$RUNNER_TEMP/demo-app"

      - name: Test generated project
        working-directory: ${{ runner.temp }}/demo-app
        run: |
          git init -q
          git add -A
          uv lock
          uv sync --locked
          uv run --locked pytest
          uv run --locked pre-commit run --all-files --show-diff-on-failure
